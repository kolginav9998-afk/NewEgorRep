<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Life OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Задачи</h1>
    <span id="status" class="status" title="Версия и режим"></span>
  </header>

  <form id="add-form" autocomplete="off">
    <input id="add-input" type="text" placeholder="Что нужно сделать?" enterkeyhint="done" maxlength="500" required>
    <button type="submit" aria-label="Добавить">+</button>
  </form>

  <section>
    <ul id="open-list" class="list"></ul>
    <p id="empty" class="muted" hidden>Пока пусто. Добавь первую задачу.</p>
  </section>

  <details id="done-block">
    <summary>Сделано: <span id="done-count">0</span></summary>
    <ul id="done-list" class="list"></ul>
  </details>

  <details class="data">
    <summary>Данные</summary>
    <div class="row">
      <button id="export-btn" type="button">Экспорт JSON</button>
      <label class="btn">Импорт<input id="import-input" type="file" accept="application/json" hidden></label>
    </div>
    <p class="muted">Всё хранится только на этом телефоне. Экспорт — твоя резервная копия.</p>
    <p id="msg" class="muted" role="status"></p>
  </details>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
